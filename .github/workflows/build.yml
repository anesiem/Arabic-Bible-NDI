name: Build check

# Debug build + unit tests ONLY. No signing, no secrets, no release:
# releases are signed by Ashraf in Android Studio, never here.
on:
  push:
    branches: [fix/pixel-ndi-title, feature/design-gradient-remote, fix/scanner-comma, feature/combined-layer-apis, feature/clear-mode, feature/one-update, feature/batch-2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
      - name: Install pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Unit tests
        run: ./gradlew testDebugUnitTest
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
